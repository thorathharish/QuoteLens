# Install once: `uv tool install pre-commit && pre-commit install`
# Ruff runs from the project's own environment, so hook and CI versions always match.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (api)
        entry: uv run --project services/api ruff check --fix
        language: system
        types: [python]
        files: ^services/api/
      - id: ruff-format
        name: ruff format (api)
        entry: uv run --project services/api ruff format
        language: system
        types: [python]
        files: ^services/api/
